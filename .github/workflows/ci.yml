name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: just ci (php ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.5"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            raw.githubusercontent.com:443
            repo.packagist.org:443
            packagist.org:443
            deb.debian.org:443
            pecl.php.net:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: sdk
      - name: Read the pinned conformance ref
        id: conformance
        run: echo "ref=$(tr -d '[:space:]' < sdk/conformance-ref)" >> "$GITHUB_OUTPUT"
      - name: Check out the conformance suite at the pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Hushscript/hushscript-sdk-conformance
          ref: ${{ steps.conformance.outputs.ref }}
          path: conformance
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Run just ci
        working-directory: sdk
        env:
          PHP_VERSION: ${{ matrix.php }}
          CONFORMANCE_CONTEXT: ../conformance
          CONFORMANCE_DIR: ../conformance
        run: just ci "$PHP_VERSION"
